services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - faiss_index:/app/data/faiss_index
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  faiss_index:
  caddy_data:
  caddy_config:
